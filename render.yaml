services:
  - type: web
    name: docuai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DOCUAI_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
